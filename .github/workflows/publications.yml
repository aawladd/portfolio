name: Sync publications (Google Scholar + ORCID)

on:
  schedule:
    - cron: "41 4 * * 1" # weekly, Monday 04:41 UTC
  workflow_dispatch: # manual run (also triggered from the admin page)

permissions:
  contents: write

concurrency:
  group: publications-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from Google Scholar and ORCID
        run: python3 .github/scripts/sync_publications.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/publications.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Sync publications from Google Scholar and ORCID"
            git pull --rebase
            git push
          fi
